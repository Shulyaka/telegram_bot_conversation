# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # Dependabot should not update Home Assistant as that should match the homeassistant key in hacs.json
      - dependency-name: "homeassistant"
      # Same for python-telegram-bot, it should match the version specified in manifest.json of telegram_bot integration
      - dependency-name: "python-telegram-bot[socks]"
      # The version of telegramify_markdown should match the version specified in manifest.json of this integration
      - dependency-name: "telegramify-markdown[mermaid]"
      # The correct version of pytest-homeassistant-custom-component is selected by pip to match the version of Home Assistant, the minimum version is there because some old versions of pytest-homeassistant-custom-component did not pin the Home Assistant version
      - dependency-name: "pytest-homeassistant-custom-component"
    cooldown:
      default-days: 7
