# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # pytest-homeassistant must match the selected Home Assistant version.
      - dependency-name: "pytest-homeassistant"
      # Dependabot should not update Home Assistant as that should match the homeassistant key in hacs.json
      - dependency-name: "homeassistant"
      # The following dependencies should match the version specified in manifest.json of this integration
      # (but we want to receive a notification from dependabot, so they stay commented out)
      # - dependency-name: "telegramify-markdown[mermaid]"
      # - dependency-name: "pyogg"
      # The following dependencies should match the versions used in Home Assistant
      - dependency-name: "aiofiles"
      - dependency-name: "colorlog"
      - dependency-name: "PyTurboJPEG"
    cooldown:
      default-days: 7
