name: CI

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.ha-version == 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha-version: "hacs"
            python-version: "3.14"
          - ha-version: "latest"
            python-version: "3.14"
          - ha-version: "latest"
            python-version: "3.15"
          - ha-version: "dev"
            python-version: "3.15"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Register problem matchers
        run: |
          echo "::add-matcher::.github/workflows/matchers/python.json"
          echo "::add-matcher::.github/workflows/matchers/pytest-slow.json"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install requirements
        run: scripts/bootstrap
        env:
          HA_VERSION: ${{ matrix.ha-version }}

      - name: Pytest
        run: pytest --cov custom_components/telegram_bot_conversation --cov-report=term-missing $(test "$RUNNER_DEBUG" && echo "-vv")

      - name: Coveralls
        uses: AndreMiras/coveralls-python-action@ac868b9540fad490f7ca82b8ca00480fd751ed19 # develop, not tagged
        with:
          parallel: true
          flag-name: ${{ matrix.ha-version }}.${{ matrix.python-version }}
          debug: ${{ runner.debug && 'true' || 'false' }}

  coverage:
    name: Coverage
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Coverage
        uses: AndreMiras/coveralls-python-action@ac868b9540fad490f7ca82b8ca00480fd751ed19 # develop, not tagged
        with:
          parallel-finished: true
          debug: ${{ runner.debug && 'true' || 'false' }}
